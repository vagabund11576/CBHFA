<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Community Health Resources</title>

    <style>

        /* GENERAL PAGE */

        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
            color: #333333;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 30px;
        }


        /* MAIN IMAGE */

        .main-image {
            width: 100%;
            display: block;
            border-radius: 12px;
            margin-bottom: 40px;
        }


        /* HEADINGS */

        h1 {
            text-align: center;
            font-size: 36px;
            margin-bottom: 40px;
        }

        h2 {
            font-size: 28px;
            margin-top: 50px;
            margin-bottom: 25px;
        }


        /* VIDEOS */

        .videos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .video {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .video h3 {
            margin-top: 0;
        }

        .video iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
            border-radius: 8px;
        }


        /* DOCUMENT SECTION */

        .documents {
            margin-top: 50px;
        }

        .language {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .language h3 {
            margin-top: 0;
            font-size: 22px;
        }

        .language a {
            display: block;
            margin: 12px 0;
            color: #0066cc;
            text-decoration: none;
        }

        .language a:hover {
            text-decoration: underline;
        }


        /* ARABIC */

        .arabic {
            direction: rtl;
            text-align: right;
        }


        /* MOBILE */

        @media (max-width: 700px) {

            .container {
                padding: 15px;
            }

            .videos {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 28px;
            }

        }

    </style>

</head>


<body>

<div class="container">


    <!-- ===================================== -->
    <!-- MAIN PICTURE -->
    <!-- ===================================== -->

    <img
        src="images/main-picture.png"
        alt="Training resources"
        class="main-image"
    >


    <!-- ===================================== -->
    <!-- PAGE TITLE -->
    <!-- ===================================== -->

    <h1>Training Resources</h1>


    <!-- ===================================== -->
    <!-- VIDEOS -->
    <!-- ===================================== -->

    <h2>Videos</h2>

    <div class="videos">


        <!-- VIDEO 1 -->

        <div class="video">

            <h3>Video 1</h3>

            <iframe
                src="https://www.youtube.com/embed/vPqic8lAj7E"
                title="Video 1"
                allowfullscreen>
            </iframe>

        </div>


        <!-- VIDEO 2 -->

        <div class="video">

            <h3>Video 2</h3>

            <iframe
                src="https://www.youtube.com/embed/l0Dp-qv3DAk"
                title="Video 2"
                allowfullscreen>
            </iframe>

        </div>


        <!-- VIDEO 3 -->

        <div class="video">

            <h3>Video 3</h3>

            <iframe
                src="https://www.youtube.com/embed/JD6afw5CWGo"
                title="Video 3"
                allowfullscreen>
            </iframe>

        </div>


        <!-- VIDEO 4 -->

        <div class="video">

            <h3>Video 4</h3>

            <iframe
                src="https://www.youtube.com/embed/3NCH-9bPGl8"
                title="Video 4"
                allowfullscreen>
            </iframe>

        </div>

    </div>


    <!-- ===================================== -->
    <!-- DOCUMENTS -->
    <!-- ===================================== -->

    <div class="documents">

        <h2>Documents</h2>


        <!-- ENGLISH -->

        <div class="language">

            <h3>🇬🇧 English</h3>

            <a href="documents/english/" >
                📁 English documents
            </a>

        </div>


        <!-- FRENCH -->

        <div class="language">

            <h3>🇫🇷 Français</h3>

            <a href="documents/french/" >
                📁 Documents en français
            </a>

        </div>


        <!-- SPANISH -->

        <div class="language">

            <h3>🇪🇸 Español</h3>

            <a href="documents/spanish/" >
                📁 Documentos en español
            </a>

        </div>


        <!-- ARABIC -->

        <div class="language arabic">

            <h3>🇸🇦 العربية</h3>

            <a href="documents/arabic/" >
                📁 الوثائق باللغة العربية
            </a>

        </div>


    </div>

</div>

</body>

</html>
